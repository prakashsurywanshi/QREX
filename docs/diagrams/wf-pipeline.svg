<text x="38" y="662" font-size="11" fill="#5b6472">A card carries value, probability and days-in-stage — the ageing signal for a stalled deal.</text>
<circle cx="21" cy="676" r="9" fill="#0f5c4e"/><text x="21" y="680" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="38" y="680" font-size="11" fill="#5b6472">Moving a card is a single PUT that stamps stage_changed_at, so days-in-stage is derived, never stored.</text>
